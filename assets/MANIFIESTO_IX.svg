  <text x="60" y="105" font-family="Courier New, monospace" font-size="14" fill="#ff0033">DATASET: 2.95M TOKENS // 147,755 LEMMAS // HAPAX: 85,120 // ALPHA: 1.2575 (R²=0.9681)</text>

