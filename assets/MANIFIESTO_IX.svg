  <text x="570" y="215" font-family="Courier New, monospace" font-size="12" fill="#00ff66">1. janus: 40,913 (Residual: -0.015)</text>
  <text x="570" y="240" font-family="Courier New, monospace" font-size="12" fill="#00ff66">2. flex: 17,239 (Residual: -0.082)</text>
  <text x="570" y="265" font-family="Courier New, monospace" font-size="12" fill="#00ff66">3. webkit: 14,124 (Residual: -0.021)</text>
  <text x="570" y="290" font-family="Courier New, monospace" font-size="12" fill="#00ff66">4. const: 11,894 (Residual: -0.028)</text>
  <text x="570" y="315" font-family="Courier New, monospace" font-size="12" fill="#00ff66">5. puntero: 8,742 (Residual: -0.019)</text>
  <text x="570" y="340" font-family="Courier New, monospace" font-size="12" fill="#00ff66">6. kernel: 6,115 (Residual: -0.047)</text>
  <text x="570" y="365" font-family="Courier New, monospace" font-size="12" fill="#ff0033">7. kenosis / void: 4,931 (Residual: +0.035)</text>

