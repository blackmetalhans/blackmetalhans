  <path d="M 450 280 C 490 280 510 240 550 240" fill="none" stroke="#ff0033" stroke-width="2.5" stroke-dasharray="6 3"/>
  <path d="M 260 410 C 260 520 480 500 500 560" fill="none" stroke="#ff0033" stroke-width="2" stroke-dasharray="4 2"/>
  <path d="M 740 410 C 740 500 520 520 500 560" fill="none" stroke="#ff0033" stroke-width="2"/>

