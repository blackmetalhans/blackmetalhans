  <text x="310" y="590" font-family="Courier New, monospace" font-size="13" fill="#ffffff">TARGET: VERTEX AI CONTEXT CACHING</text>
  <text x="310" y="615" font-family="Courier New, monospace" font-size="13" fill="#00ff66">FINANCIAL DRAIN: CLP 503,186 (~500 USD)</text>
